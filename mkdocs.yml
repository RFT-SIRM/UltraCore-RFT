site_name: UltraCore RFT
site_description: Deterministic Invariant Systems Research Laboratory
site_author: Eugeny (RFT-SIRM)
site_url: https://rft-sirm.github.io/UltraCore-RFT
copyright: Copyright 2026 Eugeny (RFT-SIRM) — Licensed under Apache-2.0

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mermaid2:
      arguments:
        theme: default

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RFT-SIRM
  version:
    provider: mike

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Strategy: strategy.md
  - Foundations: foundations.md
  - Implementation: implementation.md
  - Field Trials: field_trials.md
  - Glossary: glossary.md
  - Support: support.md
