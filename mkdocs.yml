site_name: UltraCore RFT
site_url: https://rft-sirm.github.io/UltraCore-RFT/
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/atom-variant

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RFT-SIRM/UltraCore-RFT

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Interactive Portal: interactive.md
  - Research Map: research-map.md
  - History: history.md
  - Platform: platform.md
  - Architecture: architecture.md
  - Foundations: foundations.md
  - Strategy: strategy.md
  - Implementation: implementation.md
  - Field Trials: field_trials.md
  - seL4 CDT Verification: field_trials_sel4.md
  - Glossary: glossary.md
  - Support: support.md
