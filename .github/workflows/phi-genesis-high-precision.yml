name: Phi-Genesis — High-Precision Spectral Matrix

on:
  schedule:
    - cron: "0 3 * * *" # same daily slot as Phi-Genesis upstream
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phi-genesis-high-precision-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  spectral-matrix:
    name: __SECTOR__ sector — level __LEVEL__
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - sector: A1
            level: 9
            artifact: phi-genesis-a1-level-9
          - sector: A1
            level: 10
            artifact: phi-genesis-a1-level-10
          - sector: E
            level: 9
            artifact: phi-genesis-e-level-9
    steps:
      - name: Check out UltraCore-RFT
        uses: actions/checkout@v4

      - name: Check out the canonical Phi-Genesis source
        uses: actions/checkout@v4
        with:
          repository: RFT-SIRM/Phi-Genesis
          ref: main
          path: phi-genesis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical source
        working-directory: phi-genesis
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Record hub and upstream revisions
        run: |
          {
            echo "UltraCore-RFT revision:"
            git rev-parse HEAD
            echo
            echo "Phi-Genesis source revision:"
            git -C phi-genesis rev-parse HEAD
            echo
            echo "UTC start:"
            date -u --iso-8601=seconds
            echo
            echo "Sector: __SECTOR__"
            echo "Level: __LEVEL__"
            echo "Working precision: 360 decimal digits"
            echo "Linear solve target: 210 decimal digits"
            echo "Iterations: 250"
          } | tee run-metadata.txt

      - name: Compute the mixed-precision spectral sector
        working-directory: phi-genesis
        shell: bash
        run: |
          set -o pipefail
          python computational/spectral_gap_theta_2pi/symmetry_sector_bottom.py --mixed-precision-only --mixed-precision-levels __LEVEL__ --mixed-precision-sectors __SECTOR__ --mixed-precision-dps 360 --mixed-precision-solve-digits 210 --mixed-precision-iterations 250 --mixed-precision-progress-every 20 2>&1 | tee spectral-sector.log

      - name: Preserve spectral output and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: __ARTIFACT__-${{ github.run_number }}
          path: |
            phi-genesis/spectral-sector.log
            run-metadata.txt
          if-no-files-found: warn
          retention-days: 30

  schur-certificates:
    name: Schur interval and derivative certificates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out UltraCore-RFT
        uses: actions/checkout@v4

      - name: Check out the canonical Phi-Genesis source
        uses: actions/checkout@v4
        with:
          repository: RFT-SIRM/Phi-Genesis
          ref: main
          path: phi-genesis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical source
        working-directory: phi-genesis
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Record hub and upstream revisions
        run: |
          {
            echo "UltraCore-RFT revision:"
            git rev-parse HEAD
            echo
            echo "Phi-Genesis source revision:"
            git -C phi-genesis rev-parse HEAD
            echo
            echo "UTC start:"
            date -u --iso-8601=seconds
          } | tee run-metadata.txt

      - name: Certify A1 ground state and E doublet through level 12
        working-directory: phi-genesis
        shell: bash
        run: |
          set -o pipefail
          python computational/spectral_gap_theta_2pi/schur_inertia_certificate.py --max-level 12 --dps 2450 --radius-digits 2390 2>&1 | tee schur-inertia-certificate.log

      - name: Certify Schur derivative transitions 5 through 13
        working-directory: phi-genesis
        shell: bash
        run: |
          set -o pipefail
          python computational/spectral_gap_theta_2pi/schur_derivative_certificate.py --max-level 14 --start-level 5 --dps 10000 --radius-digits 9400 2>&1 | tee schur-derivative-certificate.log

      - name: Preserve Schur certificates and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phi-genesis-schur-certificates-${{ github.run_number }}
          path: |
            phi-genesis/schur-inertia-certificate.log
            phi-genesis/schur-derivative-certificate.log
            run-metadata.txt
          if-no-files-found: warn
          retention-days: 30
