name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation strictly
        run: mkdocs build --strict --site-dir site

      - name: Expand interactive portal bundle into site artifact
        run: |
          mkdir -p site/interactive
          gzip -dc portal-src/index.html.gz > site/interactive/index.html

      - name: Verify interactive portal output
        run: |
          test -s site/interactive/index.html
          grep -q "UltraCore-RFT.*Research Explorer" site/interactive/index.html
          grep -q "id=\"theta-range\"" site/interactive/index.html
          grep -q "id=\"level-range\"" site/interactive/index.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
