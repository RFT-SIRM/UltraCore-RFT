name: Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Test interactive portfolio injector
        run: |
          python scripts/inject_core_portfolio.py --self-test
          mkdir -p /tmp/ultracore-interactive-test
          gzip -dc portal-src/index.html.gz > /tmp/ultracore-interactive-test/index.html
          python scripts/inject_core_portfolio.py /tmp/ultracore-interactive-test/index.html portal-src/core-development.html
          grep -q 'id="ultracore-core-development"' /tmp/ultracore-interactive-test/index.html
          grep -q "RFT-QPU-Sierpinski" /tmp/ultracore-interactive-test/index.html
          grep -q "SIRM Financial Infrastructure" /tmp/ultracore-interactive-test/index.html
          grep -q "Evgeny's Theorem" /tmp/ultracore-interactive-test/index.html
          grep -q "Phi-Genesis" /tmp/ultracore-interactive-test/index.html
