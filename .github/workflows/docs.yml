name: Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Verify separate research and portfolio pages
        run: |
          test -s site/core-development/index.html
          grep -q "Core Development Portfolio" site/core-development/index.html
          grep -q "RFT-QPU-Sierpinski" site/core-development/index.html
          grep -q "SIRM Financial Infrastructure" site/core-development/index.html
          grep -q "Evgeny's Theorem" site/core-development/index.html
          grep -q "Phi-Genesis" site/core-development/index.html
          gzip -dc portal-src/index.html.gz > /tmp/ultracore-research-explorer.html
          grep -q "UltraCore-RFT.*Research Explorer" /tmp/ultracore-research-explorer.html
          if grep -q "Sierpiński-first research and engineering" /tmp/ultracore-research-explorer.html; then
            echo "Core Development content must remain on its own page."
            exit 1
          fi
